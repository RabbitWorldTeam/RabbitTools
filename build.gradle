plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = mod_version
group = 'com.tr4nce'
base { archivesName = "rabbittools-${minecraft_version}-neoforge" }
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java { withSourcesJar() }

neoForge {
    version = '21.1.265'
    runs {
        client { client(); gameDirectory = file('run/client') }
        server { server(); gameDirectory = file('run/server'); programArgument '--nogui' }
        data {
            data()
            programArguments.addAll '--mod', 'rabbittools', '--all', '--output', file('src/generated/resources').absolutePath,
                    '--existing', file('src/main/resources').absolutePath
        }
    }
    mods { rabbittools { sourceSet sourceSets.main } }
}

sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
processResources {
    inputs.property 'modVersion', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand modVersion: project.version }
}
tasks.withType(Jar).configureEach {
    from('LICENSE')
    from('THIRD_PARTY_NOTICES.md')
}